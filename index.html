<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Memorize the Hidden Words of Bahá’u’lláh, from the Arabic and the Persian.">
<meta name="theme-color" content="#22407A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hidden Words">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hidden Words Memorizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a two-pane reading desk — the index of passages on the left, the practice leaf on the right; one pane at a time on phones. */
:root{
  --bg:#ECEFE9; --surface:#F8F9F5; --sunk:#E2E7DF; --ink:#1C2430; --muted:#5D6772; --line:#D2D8CF;
  --lapis:#22407A; --lapis-soft:#DCE3F0; --gold:#9C6E22; --gold-soft:#F1E6CF;
  --ok:#2B7350; --ok-soft:#DCEDE2; --bad:#A8402F; --bad-soft:#F5DFDA; --blank:#D5DCD1; --gold-line:rgba(156,110,34,.55); --gold-glow:rgba(214,170,90,.30);
  --f-display:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --f-text:"Gentium Book Plus","Gentium Plus",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#161D27; --sunk:#1D2632; --ink:#E3E6DF; --muted:#97A0AA; --line:#2A3441;
  --lapis:#93AEE4; --lapis-soft:#22324F; --gold:#D8AA5A; --gold-soft:#3A2F1C;
  --ok:#72C79B; --ok-soft:#1C3529; --bad:#E78C7E; --bad-soft:#3E2422; --blank:#283242; --gold-line:rgba(216,170,90,.6); --gold-glow:rgba(216,170,90,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#161D27; --sunk:#1D2632; --ink:#E3E6DF; --muted:#97A0AA; --line:#2A3441;
  --lapis:#93AEE4; --lapis-soft:#22324F; --gold:#D8AA5A; --gold-soft:#3A2F1C;
  --ok:#72C79B; --ok-soft:#1C3529; --bad:#E78C7E; --bad-soft:#3E2422; --blank:#283242; --gold-line:rgba(216,170,90,.6); --gold-glow:rgba(216,170,90,.16); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:4px}
.app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:2rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.tally{display:flex;gap:16px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{display:block;font-size:1.25rem;color:var(--ink);font-weight:600;line-height:1.1}
.tally .due b{color:var(--gold)}
.desk{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:22px;align-items:start}
/* index */
.index{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 4px;border-radius:8px;font-size:.8rem;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px}
.daily{border:1px solid var(--line);background:var(--gold-soft);border-radius:var(--r);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.daily small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:600}
.daily span{font-family:var(--f-text);font-size:.92rem;color:var(--muted)}
.list{overflow:auto;display:flex;flex-direction:column;border-top:1px solid var(--line);min-height:120px}
.row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:hover{background:var(--sunk)}
.row[aria-current="true"]{background:var(--lapis-soft)}
.row .num{font-family:var(--f-display);font-size:1.15rem;color:var(--lapis);text-align:center;font-variant-numeric:tabular-nums}
.row .inv{font-family:var(--f-display);font-size:1.02rem;font-weight:600;line-height:1.15;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .snip{display:block;font-family:var(--f-text);font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{display:flex;gap:2px}
.meter i{width:5px;height:14px;border-radius:2px;background:var(--blank)}
.meter i.on{background:var(--ok)}
.meter.due i.on{background:var(--gold)}
.empty{padding:20px 6px;color:var(--muted);font-size:.9rem}
/* leaf */
.leaf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,40px) 26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.leaf-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.crumb{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--lapis);text-decoration:none;text-transform:none;letter-spacing:0;font-weight:500}
.crumb a:hover{text-decoration:underline}
.back{display:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.8rem}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.82rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.iconbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.navpair{display:flex;gap:6px}
.prelude{font-family:var(--f-text);font-style:italic;color:var(--muted);margin:0;max-width:62ch}
.invocation{font-family:var(--f-display);font-weight:600;font-size:clamp(1.5rem,3.4vw,2rem);line-height:1.15;color:var(--lapis);margin:0;text-wrap:balance}
.modes{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:.85rem;color:var(--muted)}
.controls label{display:inline-flex;gap:6px;align-items:center}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
input[type=range]{accent-color:var(--lapis);width:150px}
input[type=checkbox]{accent-color:var(--lapis)}
.pct{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:3.2em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500}
.btn.primary{background:var(--lapis);border-color:var(--lapis);color:var(--surface)}
.text{font-family:var(--f-text);font-size:clamp(1.08rem,2vw,1.24rem);line-height:1.85;max-width:62ch;margin:0}
.text p{margin:0 0 .8em}
.w{border-radius:3px;transition:background .25s,color .25s}
.w.hid{color:transparent;background:linear-gradient(var(--gold-line),var(--gold-line)) 0 88%/100% 1.5px no-repeat;cursor:pointer;user-select:none;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.w.hid:hover{background-color:var(--sunk)}
.w.hid.fresh{animation:vanish .55s ease both}
.text:not(.hints) .w.hid:not(.peek) .h1{color:transparent}
.text:not(.hints) .w.hid.fresh:not(.peek) .h1{color:inherit}
.w.appear{animation:appear .4s ease}
@keyframes appear{from{color:transparent}}
@keyframes vanish{0%{color:var(--ink);background-size:0 1.5px}55%{background-size:100% 1.5px}100%{color:transparent}}
.w.hid .h1{color:var(--muted)}
.w.hid.peek{color:var(--gold);background-color:var(--gold-soft);animation:none}
.w.hid.peek .h1{color:var(--gold)}
.w.ini{cursor:pointer}
.w.ini.peek{color:var(--gold)}
.meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* recall */
textarea.recall{width:100%;box-sizing:border-box;min-height:180px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px 14px;font-family:var(--f-text);font-size:1.08rem;line-height:1.7;resize:vertical}
.diff .ok{color:var(--ink)}
.diff .miss{color:var(--bad);background:var(--bad-soft);border-radius:3px;text-decoration:underline dotted}
.diff .extra{color:var(--gold);text-decoration:line-through;font-size:.9em}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--ok)}
.score b.mid{color:var(--gold)} .score b.low{color:var(--bad)}
/* phrases */
.built{min-height:3em;font-family:var(--f-text);font-size:1.12rem;line-height:1.8;max-width:62ch;border-left:3px solid var(--gold);padding-left:14px;color:var(--ink)}
.built .ph{animation:in .3s ease}
@keyframes in{from{background:var(--ok-soft)}to{background:transparent}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px;font-family:var(--f-text);font-size:1rem;text-align:left;max-width:100%}
.chip:hover{border-color:var(--lapis)}
.chip.wrong{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* rating */
.rate{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.rate p{margin:0;font-size:.85rem;color:var(--muted);max-width:40ch}
.rate .opts{display:flex;gap:6px;flex-wrap:wrap}
.rate .opts button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-size:.85rem;font-weight:500}
.rate .opts .r0:hover{border-color:var(--bad);color:var(--bad)}
.rate .opts .r1:hover{border-color:var(--gold);color:var(--gold)}
.rate .opts .r2:hover{border-color:var(--ok);color:var(--ok)}
.status{font-size:.8rem;color:var(--muted)}
.status b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
footer{font-size:.75rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--lapis)}
kbd{font-family:var(--f-ui);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.opening{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.text p.invocation{margin-bottom:.45em}
.headpiece{display:block;width:min(260px,100%);height:auto;color:var(--gold);margin:0 0 -8px}
.text.read p.body::first-letter{font-family:var(--f-display);font-weight:600;float:left;font-size:3.5em;line-height:.8;padding:.1em .1em 0 0;color:var(--lapis)}
.leaf{position:relative;overflow:hidden}
.leaf::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 35%,var(--gold-glow) 50%,transparent 65%);background-size:300% 100%;background-position:100% 0}
.leaf.shimmer::after{animation:sweep 1.6s ease-out}
@keyframes sweep{0%{opacity:1;background-position:100% 0}85%{opacity:1}100%{opacity:0;background-position:0 0}}
.listen{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.82rem;color:var(--muted);margin-top:-6px}
.listen label{display:inline-flex;gap:6px;align-items:center}
.listen select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;max-width:12rem}
.btn.play[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.w.speaking{background-color:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft);border-radius:3px}
.aboutlink{font-size:.85rem;color:var(--lapis);text-decoration:none;border-bottom:1px solid var(--gold-line)}
.aboutlink:hover{border-bottom-color:var(--lapis)}
.about-sec{display:flex;flex-direction:column;gap:10px;max-width:64ch;border-top:1px solid var(--line);padding-top:16px}
.about-sec h3{font-family:var(--f-display);font-weight:600;font-size:1.35rem;line-height:1.2;margin:0;text-wrap:balance}
.about-note{font-size:.88rem;color:var(--muted);margin:0;max-width:64ch}
.about-note a,.q cite a{color:var(--lapis)}
.q{margin:0;padding:2px 0 2px 18px;border-left:1px solid var(--gold-line)}
.q p{font-family:var(--f-text);font-size:1.06rem;line-height:1.75;margin:0 0 .7em}
.q cite{display:block;font-style:normal;font-size:.78rem;color:var(--muted)}
.leaf.enter-next{animation:enterNext .28s ease-out}
.leaf.enter-prev{animation:enterPrev .28s ease-out}
@keyframes enterNext{from{transform:translateX(28px);opacity:.35}}
@keyframes enterPrev{from{transform:translateX(-28px);opacity:.35}}
@media (max-width:820px){
  .desk{grid-template-columns:minmax(0,1fr)}
  .index{position:static;max-height:none}
  .list{overflow:visible}
  body.reading .index{display:none}
  body:not(.reading) .leaf{display:none}
  .back{display:inline-block}
  .tally{gap:12px}
  .hidekbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>The Hidden Words</h1>
      <p>Memorize Bahá’u’lláh’s Hidden Words, from the Arabic and the Persian</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>

  <div class="desk">
    <aside class="index" aria-label="Passages">
      <div class="seg" role="group" aria-label="Collection">
        <button id="tab-arabic" data-tab="arabic" aria-pressed="true">Arabic</button>
        <button id="tab-persian" data-tab="persian" aria-pressed="false">Persian</button>
        <button id="tab-due" data-tab="due" aria-pressed="false">Review</button>
        <button id="tab-star" data-tab="star" aria-pressed="false">Starred</button>
      </div>
      <input id="search" class="search" type="search" placeholder="Search words, e.g. “justice” or “O Son of Dust”" aria-label="Search passages">
      <button class="daily" id="daily"></button>
      <div class="list" id="list"></div>
    </aside>

    <main class="leaf" id="leaf" aria-live="polite"></main>
  </div>

  <footer>Text: <i>The Hidden Words</i>, translated by Shoghi Effendi, from the <a href="https://www.bahai.org/library/authoritative-texts/bahaullah/hidden-words/" target="_blank" rel="noopener">Bahá’í Reference Library</a>, used under its <a href="https://www.bahai.org/legal" target="_blank" rel="noopener">terms of use</a>. Each passage links to its source. <span id="saveinfo">Your progress is saved on this device.</span></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const PASSAGES = [{"id":"a0","part":"arabic","n":0,"ref":"642922139","text":"This is that which hath descended from the realm of glory, uttered by the tongue of power and might, and revealed unto the Prophets of old. We have taken the inner essence thereof and clothed it in the garment of brevity, as a token of grace unto the righteous, that they may stand faithful unto the Covenant of God, may fulfill in their lives His trust, and in the realm of spirit obtain the gem of divine virtue.","title":"Preamble"},{"id":"a1","part":"arabic","n":1,"ref":"986635113","inv":"O Son of Spirit!","text":"My first counsel is this: Possess a pure, kindly and radiant heart, that thine may be a sovereignty ancient, imperishable and everlasting."},{"id":"a2","part":"arabic","n":2,"ref":"099947277","inv":"O Son of Spirit!","text":"The best beloved of all things in My sight is Justice; turn not away therefrom if thou desirest Me, and neglect it not that I may confide in thee. By its aid thou shalt see with thine own eyes and not through the eyes of others, and shalt know of thine own knowledge and not through the knowledge of thy neighbor. Ponder this in thy heart; how it behooveth thee to be. Verily justice is My gift to thee and the sign of My loving-kindness. Set it then before thine eyes."},{"id":"a3","part":"arabic","n":3,"ref":"246296008","inv":"O Son of Man!","text":"Veiled in My immemorial being and in the ancient eternity of My essence, I knew My love for thee; therefore I created thee, have engraved on thee Mine image and revealed to thee My beauty."},{"id":"a4","part":"arabic","n":4,"ref":"486363123","inv":"O Son of Man!","text":"I loved thy creation, hence I created thee. Wherefore, do thou love Me, that I may name thy name and fill thy soul with the spirit of life."},{"id":"a5","part":"arabic","n":5,"ref":"590841570","inv":"O Son of Being!","text":"Love Me, that I may love thee. If thou lovest Me not, My love can in no wise reach thee. Know this, O servant."},{"id":"a6","part":"arabic","n":6,"ref":"312164372","inv":"O Son of Being!","text":"Thy Paradise is My love; thy heavenly home, reunion with Me. Enter therein and tarry not. This is that which hath been destined for thee in Our kingdom above and Our exalted dominion."},{"id":"a7","part":"arabic","n":7,"ref":"118657418","inv":"O Son of Man!","text":"If thou lovest Me, turn away from thyself; and if thou seekest My pleasure, regard not thine own; that thou mayest die in Me and I may eternally live in thee."},{"id":"a8","part":"arabic","n":8,"ref":"102524683","inv":"O Son of Spirit!","text":"There is no peace for thee save by renouncing thyself and turning unto Me; for it behooveth thee to glory in My name, not in thine own; to put thy trust in Me and not in thyself, since I desire to be loved alone and above all that is."},{"id":"a9","part":"arabic","n":9,"ref":"204970481","inv":"O Son of Being!","text":"My love is My stronghold; he that entereth therein is safe and secure, and he that turneth away shall surely stray and perish."},{"id":"a10","part":"arabic","n":10,"ref":"249830108","inv":"O Son of Utterance!","text":"Thou art My stronghold; enter therein that thou mayest abide in safety. My love is in thee, know it, that thou mayest find Me near unto thee."},{"id":"a11","part":"arabic","n":11,"ref":"360291284","inv":"O Son of Being!","text":"Thou art My lamp and My light is in thee. Get thou from it thy radiance and seek none other than Me. For I have created thee rich and have bountifully shed My favor upon thee."},{"id":"a12","part":"arabic","n":12,"ref":"724175772","inv":"O Son of Being!","text":"With the hands of power I made thee and with the fingers of strength I created thee; and within thee have I placed the essence of My light. Be thou content with it and seek naught else, for My work is perfect and My command is binding. Question it not, nor have a doubt thereof."},{"id":"a13","part":"arabic","n":13,"ref":"511421653","inv":"O Son of Spirit!","text":"I created thee rich, why dost thou bring thyself down to poverty? Noble I made thee, wherewith dost thou abase thyself? Out of the essence of knowledge I gave thee being, why seekest thou enlightenment from anyone beside Me? Out of the clay of love I molded thee, how dost thou busy thyself with another? Turn thy sight unto thyself, that thou mayest find Me standing within thee, mighty, powerful and self-subsisting."},{"id":"a14","part":"arabic","n":14,"ref":"708223253","inv":"O Son of Man!","text":"Thou art My dominion and My dominion perisheth not; wherefore fearest thou thy perishing? Thou art My light and My light shall never be extinguished; why dost thou dread extinction? Thou art My glory and My glory fadeth not; thou art My robe and My robe shall never be outworn. Abide then in thy love for Me, that thou mayest find Me in the realm of glory."},{"id":"a15","part":"arabic","n":15,"ref":"084945209","inv":"O Son of Utterance!","text":"Turn thy face unto Mine and renounce all save Me; for My sovereignty endureth and My dominion perisheth not. If thou seekest another than Me, yea, if thou searchest the universe forevermore, thy quest will be in vain."},{"id":"a16","part":"arabic","n":16,"ref":"326933756","inv":"O Son of Light!","text":"Forget all save Me and commune with My spirit. This is of the essence of My command, therefore turn unto it."},{"id":"a17","part":"arabic","n":17,"ref":"176729752","inv":"O Son of Man!","text":"Be thou content with Me and seek no other helper. For none but Me can ever suffice thee."},{"id":"a18","part":"arabic","n":18,"ref":"172973975","inv":"O Son of Spirit!","text":"Ask not of Me that which We desire not for thee, then be content with what We have ordained for thy sake, for this is that which profiteth thee, if therewith thou dost content thyself."},{"id":"a19","part":"arabic","n":19,"ref":"203478186","inv":"O Son of the Wondrous Vision!","text":"I have breathed within thee a breath of My own Spirit, that thou mayest be My lover. Why hast thou forsaken Me and sought a beloved other than Me?"},{"id":"a20","part":"arabic","n":20,"ref":"682988442","inv":"O Son of Spirit!","text":"My claim on thee is great, it cannot be forgotten. My grace to thee is plenteous, it cannot be veiled. My love has made in thee its home, it cannot be concealed. My light is manifest to thee, it cannot be obscured."},{"id":"a21","part":"arabic","n":21,"ref":"227320942","inv":"O Son of Man!","text":"Upon the tree of effulgent glory I have hung for thee the choicest fruits, wherefore hast thou turned away and contented thyself with that which is less good? Return then unto that which is better for thee in the realm on high."},{"id":"a22","part":"arabic","n":22,"ref":"536853978","inv":"O Son of Spirit!","text":"Noble have I created thee, yet thou hast abased thyself. Rise then unto that for which thou wast created."},{"id":"a23","part":"arabic","n":23,"ref":"543131747","inv":"O Son of the Supreme!","text":"To the eternal I call thee, yet thou dost seek that which perisheth. What hath made thee turn away from Our desire and seek thine own?"},{"id":"a24","part":"arabic","n":24,"ref":"153701502","inv":"O Son of Man!","text":"Transgress not thy limits, nor claim that which beseemeth thee not. Prostrate thyself before the countenance of thy God, the Lord of might and power."},{"id":"a25","part":"arabic","n":25,"ref":"585415953","inv":"O Son of Spirit!","text":"Vaunt not thyself over the poor, for I lead him on his way and behold thee in thy evil plight and confound thee forevermore."},{"id":"a26","part":"arabic","n":26,"ref":"568477331","inv":"O Son of Being!","text":"How couldst thou forget thine own faults and busy thyself with the faults of others? Whoso doeth this is accursed of Me."},{"id":"a27","part":"arabic","n":27,"ref":"605082403","inv":"O Son of Man!","text":"Breathe not the sins of others so long as thou art thyself a sinner. Shouldst thou transgress this command, accursed wouldst thou be, and to this I bear witness."},{"id":"a28","part":"arabic","n":28,"ref":"470987721","inv":"O Son of Spirit!","text":"Know thou of a truth: He that biddeth men be just and himself committeth iniquity is not of Me, even though he bear My name."},{"id":"a29","part":"arabic","n":29,"ref":"762019759","inv":"O Son of Being!","text":"Ascribe not to any soul that which thou wouldst not have ascribed to thee, and say not that which thou doest not. This is My command unto thee, do thou observe it."},{"id":"a30","part":"arabic","n":30,"ref":"172419670","inv":"O Son of Man!","text":"Deny not My servant should he ask anything from thee, for his face is My face; be then abashed before Me."},{"id":"a31","part":"arabic","n":31,"ref":"048313746","inv":"O Son of Being!","text":"Bring thyself to account each day ere thou art summoned to a reckoning; for death, unheralded, shall come upon thee and thou shalt be called to give account for thy deeds."},{"id":"a32","part":"arabic","n":32,"ref":"674148173","inv":"O Son of the Supreme!","text":"I have made death a messenger of joy to thee. Wherefore dost thou grieve? I made the light to shed on thee its splendor. Why dost thou veil thyself therefrom?"},{"id":"a33","part":"arabic","n":33,"ref":"687429569","inv":"O Son of Spirit!","text":"With the joyful tidings of light I hail thee: rejoice! To the court of holiness I summon thee; abide therein that thou mayest live in peace forevermore."},{"id":"a34","part":"arabic","n":34,"ref":"955217479","inv":"O Son of Spirit!","text":"The spirit of holiness beareth unto thee the joyful tidings of reunion; wherefore dost thou grieve? The spirit of power confirmeth thee in His cause; why dost thou veil thyself? The light of His countenance doth lead thee; how canst thou go astray?"},{"id":"a35","part":"arabic","n":35,"ref":"695756189","inv":"O Son of Man!","text":"Sorrow not save that thou art far from Us. Rejoice not save that thou art drawing near and returning unto Us."},{"id":"a36","part":"arabic","n":36,"ref":"745110864","inv":"O Son of Man!","text":"Rejoice in the gladness of thine heart, that thou mayest be worthy to meet Me and to mirror forth My beauty."},{"id":"a37","part":"arabic","n":37,"ref":"457228072","inv":"O Son of Man!","text":"Divest not thyself of My beauteous robe, and forfeit not thy portion from My wondrous fountain, lest thou shouldst thirst forevermore."},{"id":"a38","part":"arabic","n":38,"ref":"348139945","inv":"O Son of Being!","text":"Walk in My statutes for love of Me and deny thyself that which thou desirest if thou seekest My pleasure."},{"id":"a39","part":"arabic","n":39,"ref":"231198685","inv":"O Son of Man!","text":"Neglect not My commandments if thou lovest My beauty, and forget not My counsels if thou wouldst attain My good pleasure."},{"id":"a40","part":"arabic","n":40,"ref":"815268217","inv":"O Son of Man!","text":"Wert thou to speed through the immensity of space and traverse the expanse of heaven, yet thou wouldst find no rest save in submission to Our command and humbleness before Our Face."},{"id":"a41","part":"arabic","n":41,"ref":"847002213","inv":"O Son of Man!","text":"Magnify My cause that I may reveal unto thee the mysteries of My greatness and shine upon thee with the light of eternity."},{"id":"a42","part":"arabic","n":42,"ref":"588699010","inv":"O Son of Man!","text":"Humble thyself before Me, that I may graciously visit thee. Arise for the triumph of My cause, that while yet on earth thou mayest obtain the victory."},{"id":"a43","part":"arabic","n":43,"ref":"483970230","inv":"O Son of Being!","text":"Make mention of Me on My earth, that in My heaven I may remember thee, thus shall Mine eyes and thine be solaced."},{"id":"a44","part":"arabic","n":44,"ref":"856926883","inv":"O Son of the Throne!","text":"Thy hearing is My hearing, hear thou therewith. Thy sight is My sight, do thou see therewith, that in thine inmost soul thou mayest testify unto My exalted sanctity, and I within Myself may bear witness unto an exalted station for thee."},{"id":"a45","part":"arabic","n":45,"ref":"900928409","inv":"O Son of Being!","text":"Seek a martyr’s death in My path, content with My pleasure and thankful for that which I ordain, that thou mayest repose with Me beneath the canopy of majesty behind the tabernacle of glory."},{"id":"a46","part":"arabic","n":46,"ref":"950471653","inv":"O Son of Man!","text":"Ponder and reflect. Is it thy wish to die upon thy bed, or to shed thy lifeblood on the dust, a martyr in My path, and so become the manifestation of My command and the revealer of My light in the highest paradise? Judge thou aright, O servant!"},{"id":"a47","part":"arabic","n":47,"ref":"147382821","inv":"O Son of Man!","text":"By My beauty! To tinge thy hair with thy blood is greater in My sight than the creation of the universe and the light of both worlds. Strive then to attain this, O servant!"},{"id":"a48","part":"arabic","n":48,"ref":"200697020","inv":"O Son of Man!","text":"For everything there is a sign. The sign of love is fortitude under My decree and patience under My trials."},{"id":"a49","part":"arabic","n":49,"ref":"930638360","inv":"O Son of Man!","text":"The true lover yearneth for tribulation even as doth the rebel for forgiveness and the sinful for mercy."},{"id":"a50","part":"arabic","n":50,"ref":"472999964","inv":"O Son of Man!","text":"If adversity befall thee not in My path, how canst thou walk in the ways of them that are content with My pleasure? If trials afflict thee not in thy longing to meet Me, how wilt thou attain the light in thy love for My beauty?"},{"id":"a51","part":"arabic","n":51,"ref":"746355706","inv":"O Son of Man!","text":"My calamity is My providence, outwardly it is fire and vengeance, but inwardly it is light and mercy. Hasten thereunto that thou mayest become an eternal light and an immortal spirit. This is My command unto thee, do thou observe it."},{"id":"a52","part":"arabic","n":52,"ref":"118018611","inv":"O Son of Man!","text":"Should prosperity befall thee, rejoice not, and should abasement come upon thee, grieve not, for both shall pass away and be no more."},{"id":"a53","part":"arabic","n":53,"ref":"956386997","inv":"O Son of Being!","text":"If poverty overtake thee, be not sad; for in time the Lord of wealth shall visit thee. Fear not abasement, for glory shall one day rest on thee."},{"id":"a54","part":"arabic","n":54,"ref":"562190408","inv":"O Son of Being!","text":"If thine heart be set upon this eternal, imperishable dominion, and this ancient, everlasting life, forsake this mortal and fleeting sovereignty."},{"id":"a55","part":"arabic","n":55,"ref":"561352140","inv":"O Son of Being!","text":"Busy not thyself with this world, for with fire We test the gold, and with gold We test Our servants."},{"id":"a56","part":"arabic","n":56,"ref":"748392247","inv":"O Son of Man!","text":"Thou dost wish for gold and I desire thy freedom from it. Thou thinkest thyself rich in its possession, and I recognize thy wealth in thy sanctity therefrom. By My life! This is My knowledge, and that is thy fancy; how can My way accord with thine?"},{"id":"a57","part":"arabic","n":57,"ref":"636691280","inv":"O Son of Man!","text":"Bestow My wealth upon My poor, that in heaven thou mayest draw from stores of unfading splendor and treasures of imperishable glory. But by My life! To offer up thy soul is a more glorious thing couldst thou but see with Mine eye."},{"id":"a58","part":"arabic","n":58,"ref":"543261789","inv":"O Son of Man!","text":"The temple of being is My throne; cleanse it of all things, that there I may be established and there I may abide."},{"id":"a59","part":"arabic","n":59,"ref":"804011987","inv":"O Son of Being!","text":"Thy heart is My home; sanctify it for My descent. Thy spirit is My place of revelation; cleanse it for My manifestation."},{"id":"a60","part":"arabic","n":60,"ref":"287468342","inv":"O Son of Man!","text":"Put thy hand into My bosom, that I may rise above thee, radiant and resplendent."},{"id":"a61","part":"arabic","n":61,"ref":"755666283","inv":"O Son of Man!","text":"Ascend unto My heaven, that thou mayest obtain the joy of reunion, and from the chalice of imperishable glory quaff the peerless wine."},{"id":"a62","part":"arabic","n":62,"ref":"677243732","inv":"O Son of Man!","text":"Many a day hath passed over thee whilst thou hast busied thyself with thy fancies and idle imaginings. How long art thou to slumber on thy bed? Lift up thy head from slumber, for the Sun hath risen to the zenith, haply it may shine upon thee with the light of beauty."},{"id":"a63","part":"arabic","n":63,"ref":"244905205","inv":"O Son of Man!","text":"The light hath shone on thee from the horizon of the sacred Mount and the spirit of enlightenment hath breathed in the Sinai of thy heart. Wherefore, free thyself from the veils of idle fancies and enter into My court, that thou mayest be fit for everlasting life and worthy to meet Me. Thus may death not come upon thee, neither weariness nor trouble."},{"id":"a64","part":"arabic","n":64,"ref":"101409766","inv":"O Son of Man!","text":"My eternity is My creation, I have created it for thee. Make it the garment of thy temple. My unity is My handiwork; I have wrought it for thee; clothe thyself therewith, that thou mayest be to all eternity the revelation of My everlasting being."},{"id":"a65","part":"arabic","n":65,"ref":"439014978","inv":"O Son of Man!","text":"My majesty is My gift to thee, and My grandeur the token of My mercy unto thee. That which beseemeth Me none shall understand, nor can anyone recount. Verily, I have preserved it in My hidden storehouses and in the treasuries of My command, as a sign of My loving-kindness unto My servants and My mercy unto My people."},{"id":"a66","part":"arabic","n":66,"ref":"716805208","inv":"O Children of the Divine and Invisible Essence!","text":"Ye shall be hindered from loving Me and souls shall be perturbed as they make mention of Me. For minds cannot grasp Me nor hearts contain Me."},{"id":"a67","part":"arabic","n":67,"ref":"044427246","inv":"O Son of Beauty!","text":"By My spirit and by My favor! By My mercy and by My beauty! All that I have revealed unto thee with the tongue of power, and have written for thee with the pen of might, hath been in accordance with thy capacity and understanding, not with My state and the melody of My voice."},{"id":"a68","part":"arabic","n":68,"ref":"685666862","inv":"O Children of Men!","text":"Know ye not why We created you all from the same dust? That no one should exalt himself over the other. Ponder at all times in your hearts how ye were created. Since We have created you all from one same substance it is incumbent on you to be even as one soul, to walk with the same feet, eat with the same mouth and dwell in the same land, that from your inmost being, by your deeds and actions, the signs of oneness and the essence of detachment may be made manifest. Such is My counsel to you, O concourse of light! Heed ye this counsel that ye may obtain the fruit of holiness from the tree of wondrous glory."},{"id":"a69","part":"arabic","n":69,"ref":"414744315","inv":"O Ye Sons of Spirit!","text":"Ye are My treasury, for in you I have treasured the pearls of My mysteries and the gems of My knowledge. Guard them from the strangers amidst My servants and from the ungodly amongst My people."},{"id":"a70","part":"arabic","n":70,"ref":"186817587","inv":"O Son of Him that Stood by His Own Entity in the Kingdom of His Self!","text":"Know thou, that I have wafted unto thee all the fragrances of holiness, have fully revealed to thee My word, have perfected through thee My bounty and have desired for thee that which I have desired for My Self. Be then content with My pleasure and thankful unto Me."},{"id":"a71","part":"arabic","n":71,"ref":"296667998","inv":"O Son of Man!","text":"Write all that We have revealed unto thee with the ink of light upon the tablet of thy spirit. Should this not be in thy power, then make thine ink of the essence of thy heart. If this thou canst not do, then write with that crimson ink that hath been shed in My path. Sweeter indeed is this to Me than all else, that its light may endure forever."},{"id":"p1","part":"persian","n":1,"ref":"099391514","inv":"O Ye People that Have Minds to Know and Ears to Hear!","text":"The first call of the Beloved is this: O mystic nightingale! Abide not but in the rose garden of the spirit. O messenger of the Solomon of love! Seek thou no shelter except in the Sheba of the well-beloved, and O immortal phoenix! dwell not save on the mount of faithfulness. Therein is thy habitation, if on the wings of thy soul thou soarest to the realm of the infinite and seekest to attain thy goal."},{"id":"p2","part":"persian","n":2,"ref":"775010913","inv":"O Son of Spirit!","text":"The bird seeketh its nest; the nightingale the charm of the rose; whilst those birds, the hearts of men, content with transient dust, have strayed far from their eternal nest, and with eyes turned towards the slough of heedlessness are bereft of the glory of the divine presence. Alas! How strange and pitiful; for a mere cupful, they have turned away from the billowing seas of the Most High, and remained far from the most effulgent horizon."},{"id":"p3","part":"persian","n":3,"ref":"607855955","inv":"O Friend!","text":"In the garden of thy heart plant naught but the rose of love, and from the nightingale of affection and desire loosen not thy hold. Treasure the companionship of the righteous and eschew all fellowship with the ungodly."},{"id":"p4","part":"persian","n":4,"ref":"445619358","inv":"O Son of Justice!","text":"Whither can a lover go but to the land of his beloved? and what seeker findeth rest away from his heart’s desire? To the true lover reunion is life, and separation is death. His breast is void of patience and his heart hath no peace. A myriad lives he would forsake to hasten to the abode of his beloved."},{"id":"p5","part":"persian","n":5,"ref":"646280975","inv":"O Son of Dust!","text":"Verily I say unto thee: Of all men the most negligent is he that disputeth idly and seeketh to advance himself over his brother. Say: O brethren! Let deeds, not words, be your adorning."},{"id":"p6","part":"persian","n":6,"ref":"909712031","inv":"O Son of Earth!","text":"Know, verily, the heart wherein the least remnant of envy yet lingereth, shall never attain My everlasting dominion, nor inhale the sweet savors of holiness breathing from My kingdom of sanctity."},{"id":"p7","part":"persian","n":7,"ref":"866203931","inv":"O Son of Love!","text":"Thou art but one step away from the glorious heights above and from the celestial tree of love. Take thou one pace and with the next advance into the immortal realm and enter the pavilion of eternity. Give ear then to that which hath been revealed by the Pen of Glory."},{"id":"p8","part":"persian","n":8,"ref":"105970176","inv":"O Son of Glory!","text":"Be swift in the path of holiness, and enter the heaven of communion with Me. Cleanse thy heart with the burnish of the spirit, and hasten to the court of the Most High."},{"id":"p9","part":"persian","n":9,"ref":"484615704","inv":"O Fleeting Shadow!","text":"Pass beyond the baser stages of doubt and rise to the exalted heights of certainty. Open the eye of truth, that thou mayest behold the veilless Beauty and exclaim: Hallowed be the Lord, the most excellent of all creators!"},{"id":"p10","part":"persian","n":10,"ref":"915407365","inv":"O Son of Desire!","text":"Give ear unto this: Never shall mortal eye recognize the everlasting Beauty, nor the lifeless heart delight in aught but in the withered bloom. For like seeketh like, and taketh pleasure in the company of its kind."},{"id":"p11","part":"persian","n":11,"ref":"756281961","inv":"O Son of Dust!","text":"Blind thine eyes, that thou mayest behold My beauty; stop thine ears, that thou mayest hearken unto the sweet melody of My voice; empty thyself of all learning, that thou mayest partake of My knowledge; and sanctify thyself from riches, that thou mayest obtain a lasting share from the ocean of My eternal wealth. Blind thine eyes, that is, to all save My beauty; stop thine ears to all save My word; empty thyself of all learning save the knowledge of Me; that with a clear vision, a pure heart and an attentive ear thou mayest enter the court of My holiness."},{"id":"p12","part":"persian","n":12,"ref":"775762706","inv":"O Man of Two Visions!","text":"Close one eye and open the other. Close one to the world and all that is therein, and open the other to the hallowed beauty of the Beloved."},{"id":"p13","part":"persian","n":13,"ref":"944463388","inv":"O My Children!","text":"I fear lest, bereft of the melody of the dove of heaven, ye will sink back to the shades of utter loss, and, never having gazed upon the beauty of the rose, return to water and clay."},{"id":"p14","part":"persian","n":14,"ref":"909085672","inv":"O Friends!","text":"Abandon not the everlasting beauty for a beauty that must die, and set not your affections on this mortal world of dust."},{"id":"p15","part":"persian","n":15,"ref":"411149860","inv":"O Son of Spirit!","text":"The time cometh, when the nightingale of holiness will no longer unfold the inner mysteries and ye will all be bereft of the celestial melody and of the voice from on high."},{"id":"p16","part":"persian","n":16,"ref":"748143718","inv":"O Essence of Negligence!","text":"Myriads of mystic tongues find utterance in one speech, and myriads of hidden mysteries are revealed in a single melody; yet, alas, there is no ear to hear, nor heart to understand."},{"id":"p17","part":"persian","n":17,"ref":"304654598","inv":"O Comrades!","text":"The gates that open on the Placeless stand wide and the habitation of the loved one is adorned with the lovers’ blood, yet all but a few remain bereft of this celestial city, and even of these few, none but the smallest handful hath been found with a pure heart and sanctified spirit."},{"id":"p18","part":"persian","n":18,"ref":"915681675","inv":"O Ye Dwellers in the Highest Paradise!","text":"Proclaim unto the children of assurance that within the realms of holiness, nigh unto the celestial paradise, a new garden hath appeared, round which circle the denizens of the realm on high and the immortal dwellers of the exalted paradise. Strive, then, that ye may attain that station, that ye may unravel the mysteries of love from its windflowers and learn the secret of divine and consummate wisdom from its eternal fruits. Solaced are the eyes of them that enter and abide therein!"},{"id":"p19","part":"persian","n":19,"ref":"069414826","inv":"O My Friends!","text":"Have ye forgotten that true and radiant morn, when in those hallowed and blessed surroundings ye were all gathered in My presence beneath the shade of the tree of life, which is planted in the all-glorious paradise? Awestruck ye listened as I gave utterance to these three most holy words: O friends! Prefer not your will to Mine, never desire that which I have not desired for you, and approach Me not with lifeless hearts, defiled with worldly desires and cravings. Would ye but sanctify your souls, ye would at this present hour recall that place and those surroundings, and the truth of My utterance should be made evident unto all of you."},{"id":"p20","part":"persian","n":20,"ref":"824146051","inv":"O Ye That Are Lying as Dead on the Couch of Heedlessness!","pre":"In the eighth of the most holy lines, in the fifth Tablet of Paradise, He saith:","text":"Ages have passed and your precious lives are well-nigh ended, yet not a single breath of purity hath reached Our court of holiness from you. Though immersed in the ocean of misbelief, yet with your lips ye profess the one true faith of God. Him whom I abhor ye have loved, and of My foe ye have made a friend. Notwithstanding, ye walk on My earth complacent and self-satisfied, heedless that My earth is weary of you and everything within it shunneth you. Were ye but to open your eyes, ye would, in truth, prefer a myriad griefs unto this joy, and would count death itself better than this life."},{"id":"p21","part":"persian","n":21,"ref":"492712156","inv":"O Moving Form of Dust!","text":"I desire communion with thee, but thou wouldst put no trust in Me. The sword of thy rebellion hath felled the tree of thy hope. At all times I am near unto thee, but thou art ever far from Me. Imperishable glory I have chosen for thee, yet boundless shame thou hast chosen for thyself. While there is yet time, return, and lose not thy chance."},{"id":"p22","part":"persian","n":22,"ref":"475255532","inv":"O Son of Desire!","text":"The learned and the wise have for long years striven and failed to attain the presence of the All-Glorious; they have spent their lives in search of Him, yet did not behold the beauty of His countenance. Thou without the least effort didst attain thy goal, and without search hast obtained the object of thy quest. Yet, notwithstanding, thou didst remain so wrapt in the veil of self, that thine eyes beheld not the beauty of the Beloved, nor did thy hand touch the hem of His robe. Ye that have eyes, behold and wonder."},{"id":"p23","part":"persian","n":23,"ref":"927133713","inv":"O Dwellers in the City of Love!","text":"Mortal blasts have beset the everlasting candle, and the beauty of the celestial Youth is veiled in the darkness of dust. The chief of the monarchs of love is wronged by the people of tyranny and the dove of holiness lieth prisoned in the talons of owls. The dwellers in the pavilion of glory and the celestial concourse bewail and lament, while ye repose in the realm of negligence, and esteem yourselves as of the true friends. How vain are your imaginings!"},{"id":"p24","part":"persian","n":24,"ref":"904750204","inv":"O Ye That Are Foolish, Yet Have a Name to Be Wise!","text":"Wherefore do ye wear the guise of shepherds, when inwardly ye have become wolves, intent upon My flock? Ye are even as the star, which riseth ere the dawn, and which, though it seem radiant and luminous, leadeth the wayfarers of My city astray into the paths of perdition."},{"id":"p25","part":"persian","n":25,"ref":"947541230","inv":"O Ye Seeming Fair Yet Inwardly Foul!","text":"Ye are like clear but bitter water, which to outward seeming is crystal pure but of which, when tested by the divine Assayer, not a drop is accepted. Yea, the sunbeam falleth alike upon the dust and the mirror, yet differ they in reflection even as doth the star from the earth: nay, immeasurable is the difference!"},{"id":"p26","part":"persian","n":26,"ref":"676488956","inv":"O My Friend in Word!","text":"Ponder awhile. Hast thou ever heard that friend and foe should abide in one heart? Cast out then the stranger, that the Friend may enter His home."},{"id":"p27","part":"persian","n":27,"ref":"326525665","inv":"O Son of Dust!","text":"All that is in heaven and earth I have ordained for thee, except the human heart, which I have made the habitation of My beauty and glory; yet thou didst give My home and dwelling to another than Me; and whenever the manifestation of My holiness sought His own abode, a stranger found He there, and, homeless, hastened unto the sanctuary of the Beloved. Notwithstanding I have concealed thy secret and desired not thy shame."},{"id":"p28","part":"persian","n":28,"ref":"642676691","inv":"O Essence of Desire!","text":"At many a dawn have I turned from the realms of the Placeless unto thine abode, and found thee on the bed of ease busied with others than Myself. Thereupon, even as the flash of the spirit, I returned to the realms of celestial glory and breathed it not in My retreats above unto the hosts of holiness."},{"id":"p29","part":"persian","n":29,"ref":"567841905","inv":"O Son of Bounty!","text":"Out of the wastes of nothingness, with the clay of My command I made thee to appear, and have ordained for thy training every atom in existence and the essence of all created things. Thus, ere thou didst issue from thy mother’s womb, I destined for thee two founts of gleaming milk, eyes to watch over thee, and hearts to love thee. Out of My loving-kindness, ’neath the shade of My mercy I nurtured thee, and guarded thee by the essence of My grace and favor. And My purpose in all this was that thou mightest attain My everlasting dominion and become worthy of My invisible bestowals. And yet heedless thou didst remain, and when fully grown, thou didst neglect all My bounties and occupied thyself with thine idle imaginings, in such wise that thou didst become wholly forgetful, and, turning away from the portals of the Friend didst abide within the courts of My enemy."},{"id":"p30","part":"persian","n":30,"ref":"931320080","inv":"O Bondslave of the World!","text":"Many a dawn hath the breeze of My loving-kindness wafted over thee and found thee upon the bed of heedlessness fast asleep. Bewailing then thy plight it returned whence it came."},{"id":"p31","part":"persian","n":31,"ref":"809848791","inv":"O Son of Earth!","text":"Wouldst thou have Me, seek none other than Me; and wouldst thou gaze upon My beauty, close thine eyes to the world and all that is therein; for My will and the will of another than Me, even as fire and water, cannot dwell together in one heart."},{"id":"p32","part":"persian","n":32,"ref":"889172469","inv":"O Befriended Stranger!","text":"The candle of thine heart is lighted by the hand of My power, quench it not with the contrary winds of self and passion. The healer of all thine ills is remembrance of Me, forget it not. Make My love thy treasure and cherish it even as thy very sight and life."},{"id":"p33","part":"persian","n":33,"ref":"725404749","inv":"O My Brother!","text":"Hearken to the delightsome words of My honeyed tongue, and quaff the stream of mystic holiness from My sugar-shedding lips. Sow the seeds of My divine wisdom in the pure soil of thy heart, and water them with the water of certitude, that the hyacinths of My knowledge and wisdom may spring up fresh and green in the sacred city of thy heart."},{"id":"p34","part":"persian","n":34,"ref":"478336069","inv":"O Dwellers of My Paradise!","text":"With the hands of loving-kindness I have planted in the holy garden of paradise the young tree of your love and friendship, and have watered it with the goodly showers of My tender grace; now that the hour of its fruiting is come, strive that it may be protected, and be not consumed with the flame of desire and passion."},{"id":"p35","part":"persian","n":35,"ref":"839248912","inv":"O My Friends!","text":"Quench ye the lamp of error, and kindle within your hearts the everlasting torch of divine guidance. For ere long the assayers of mankind shall, in the holy presence of the Adored, accept naught but purest virtue and deeds of stainless holiness."},{"id":"p36","part":"persian","n":36,"ref":"447289253","inv":"O Son of Dust!","text":"The wise are they that speak not unless they obtain a hearing, even as the cup-bearer, who proffereth not his cup till he findeth a seeker, and the lover who crieth not out from the depths of his heart until he gazeth upon the beauty of his beloved. Wherefore sow the seeds of wisdom and knowledge in the pure soil of the heart, and keep them hidden, till the hyacinths of divine wisdom spring from the heart and not from mire and clay."},{"id":"p37","part":"persian","n":37,"ref":"998408191","inv":"O My Servant!","pre":"In the first line of the Tablet it is recorded and written, and within the sanctuary of the tabernacle of God is hidden:","text":"Abandon not for that which perisheth an everlasting dominion, and cast not away celestial sovereignty for a worldly desire. This is the river of everlasting life that hath flowed from the wellspring of the pen of the merciful; well is it with them that drink!"},{"id":"p38","part":"persian","n":38,"ref":"988131543","inv":"O Son of Spirit!","text":"Burst thy cage asunder, and even as the phoenix of love soar into the firmament of holiness. Renounce thyself and, filled with the spirit of mercy, abide in the realm of celestial sanctity."},{"id":"p39","part":"persian","n":39,"ref":"921804077","inv":"O Offspring of Dust!","text":"Be not content with the ease of a passing day, and deprive not thyself of everlasting rest. Barter not the garden of eternal delight for the dust-heap of a mortal world. Up from thy prison ascend unto the glorious meads above, and from thy mortal cage wing thy flight unto the paradise of the Placeless."},{"id":"p40","part":"persian","n":40,"ref":"178899283","inv":"O My Servant!","text":"Free thyself from the fetters of this world, and loose thy soul from the prison of self. Seize thy chance, for it will come to thee no more."},{"id":"p41","part":"persian","n":41,"ref":"228576295","inv":"O Son of My Handmaid!","text":"Didst thou behold immortal sovereignty, thou wouldst strive to pass from this fleeting world. But to conceal the one from thee and to reveal the other is a mystery which none but the pure in heart can comprehend."},{"id":"p42","part":"persian","n":42,"ref":"006213096","inv":"O My Servant!","text":"Purge thy heart from malice and, innocent of envy, enter the divine court of holiness."},{"id":"p43","part":"persian","n":43,"ref":"452186269","inv":"O My Friends!","text":"Walk ye in the ways of the good pleasure of the Friend, and know that His pleasure is in the pleasure of His creatures. That is: no man should enter the house of his friend save at his friend’s pleasure, nor lay hands upon his treasures nor prefer his own will to his friend’s, and in no wise seek an advantage over him. Ponder this, ye that have insight!"},{"id":"p44","part":"persian","n":44,"ref":"697759113","inv":"O Companion of My Throne!","text":"Hear no evil, and see no evil, abase not thyself, neither sigh and weep. Speak no evil, that thou mayest not hear it spoken unto thee, and magnify not the faults of others that thine own faults may not appear great; and wish not the abasement of anyone, that thine own abasement be not exposed. Live then the days of thy life, that are less than a fleeting moment, with thy mind stainless, thy heart unsullied, thy thoughts pure, and thy nature sanctified, so that, free and content, thou mayest put away this mortal frame, and repair unto the mystic paradise and abide in the eternal kingdom forevermore."},{"id":"p45","part":"persian","n":45,"ref":"577977380","inv":"Alas! Alas! O Lovers of Worldly Desire!","text":"Even as the swiftness of lightning ye have passed by the Beloved One, and have set your hearts on satanic fancies. Ye bow the knee before your vain imagining, and call it truth. Ye turn your eyes towards the thorn, and name it a flower. Not a pure breath have ye breathed, nor hath the breeze of detachment been wafted from the meadows of your hearts. Ye have cast to the winds the loving counsels of the Beloved and have effaced them utterly from the tablet of your hearts, and even as the beasts of the field, ye move and have your being within the pastures of desire and passion."},{"id":"p46","part":"persian","n":46,"ref":"076998102","inv":"O Brethren in the Path!","text":"Wherefore have ye neglected the mention of the Loved One, and kept remote from His holy presence? The essence of beauty is within the peerless pavilion, set upon the throne of glory, whilst ye busy yourselves with idle contentions. The sweet savors of holiness are breathing and the breath of bounty is wafted, yet ye are all sorely afflicted and deprived thereof. Alas for you and for them that walk in your ways and follow in your footsteps!"},{"id":"p47","part":"persian","n":47,"ref":"630765205","inv":"O Children of Desire!","text":"Put away the garment of vainglory, and divest yourselves of the attire of haughtiness."},{"id":"p48","part":"persian","n":48,"ref":"410608045","inv":"O Brethren!","pre":"In the third of the most holy lines writ and recorded in the Ruby Tablet by the pen of the unseen this is revealed:","text":"Be forbearing one with another and set not your affections on things below. Pride not yourselves in your glory, and be not ashamed of abasement. By My beauty! I have created all things from dust, and to dust will I return them again."},{"id":"p49","part":"persian","n":49,"ref":"886046055","inv":"O Children of Dust!","text":"Tell the rich of the midnight sighing of the poor, lest heedlessness lead them into the path of destruction, and deprive them of the Tree of Wealth. To give and to be generous are attributes of Mine; well is it with him that adorneth himself with My virtues."},{"id":"p50","part":"persian","n":50,"ref":"089879189","inv":"O Quintessence of Passion!","text":"Put away all covetousness and seek contentment; for the covetous hath ever been deprived, and the contented hath ever been loved and praised."},{"id":"p51","part":"persian","n":51,"ref":"937503023","inv":"O Son of My Handmaid!","text":"Be not troubled in poverty nor confident in riches, for poverty is followed by riches, and riches are followed by poverty. Yet to be poor in all save God is a wondrous gift, belittle not the value thereof, for in the end it will make thee rich in God, and thus thou shalt know the meaning of the utterance, “In truth ye are the poor,” and the holy words, “God is the all-possessing,” shall even as the true morn break forth gloriously resplendent upon the horizon of the lover’s heart, and abide secure on the throne of wealth."},{"id":"p52","part":"persian","n":52,"ref":"564055916","inv":"O Children of Negligence and Passion!","text":"Ye have suffered My enemy to enter My house and have cast out My friend, for ye have enshrined the love of another than Me in your hearts. Give ear to the sayings of the Friend and turn towards His paradise. Worldly friends, seeking their own good, appear to love one the other, whereas the true Friend hath loved and doth love you for your own sakes; indeed He hath suffered for your guidance countless afflictions. Be not disloyal to such a Friend, nay rather hasten unto Him. Such is the daystar of the word of truth and faithfulness, that hath dawned above the horizon of the pen of the Lord of all names. Open your ears that ye may hearken unto the word of God, the Help in peril, the Self-Existent."},{"id":"p53","part":"persian","n":53,"ref":"305325189","inv":"O Ye that Pride Yourselves on Mortal Riches!","text":"Know ye in truth that wealth is a mighty barrier between the seeker and his desire, the lover and his beloved. The rich, but for a few, shall in no wise attain the court of His presence nor enter the city of content and resignation. Well is it then with him, who, being rich, is not hindered by his riches from the eternal kingdom, nor deprived by them of imperishable dominion. By the Most Great Name! The splendor of such a wealthy man shall illuminate the dwellers of heaven even as the sun enlightens the people of the earth!"},{"id":"p54","part":"persian","n":54,"ref":"278984163","inv":"O Ye Rich Ones on Earth!","text":"The poor in your midst are My trust; guard ye My trust, and be not intent only on your own ease."},{"id":"p55","part":"persian","n":55,"ref":"801572056","inv":"O Son of Passion!","text":"Cleanse thyself from the defilement of riches and in perfect peace advance into the realm of poverty; that from the wellspring of detachment thou mayest quaff the wine of immortal life."},{"id":"p56","part":"persian","n":56,"ref":"289429069","inv":"O My Son!","text":"The company of the ungodly increaseth sorrow, whilst fellowship with the righteous cleanseth the rust from off the heart. He that seeketh to commune with God, let him betake himself to the companionship of His loved ones; and he that desireth to hearken unto the word of God, let him give ear to the words of His chosen ones."},{"id":"p57","part":"persian","n":57,"ref":"801831638","inv":"O Son of Dust!","text":"Beware! Walk not with the ungodly and seek not fellowship with him, for such companionship turneth the radiance of the heart into infernal fire."},{"id":"p58","part":"persian","n":58,"ref":"628305516","inv":"O Son of My Handmaid!","text":"Wouldst thou seek the grace of the Holy Spirit, enter into fellowship with the righteous, for he hath drunk the cup of eternal life at the hands of the immortal Cupbearer and even as the true morn doth quicken and illumine the hearts of the dead."},{"id":"p59","part":"persian","n":59,"ref":"605312464","inv":"O Heedless Ones!","text":"Think not the secrets of hearts are hidden, nay, know ye of a certainty that in clear characters they are engraved and are openly manifest in the holy Presence."},{"id":"p60","part":"persian","n":60,"ref":"640297357","inv":"O Friends!","text":"Verily I say, whatsoever ye have concealed within your hearts is to Us open and manifest as the day; but that it is hidden is of Our grace and favor, and not of your deserving."},{"id":"p61","part":"persian","n":61,"ref":"814768124","inv":"O Son of Man!","text":"A dewdrop out of the fathomless ocean of My mercy I have shed upon the peoples of the world, yet found none turn thereunto, inasmuch as everyone hath turned away from the celestial wine of unity unto the foul dregs of impurity, and, content with mortal cup, hath put away the chalice of immortal beauty. Vile is that wherewith he is contented."},{"id":"p62","part":"persian","n":62,"ref":"718768059","inv":"O Son of Dust!","text":"Turn not away thine eyes from the matchless wine of the immortal Beloved, and open them not to foul and mortal dregs. Take from the hands of the divine Cupbearer the chalice of immortal life, that all wisdom may be thine, and that thou mayest hearken unto the mystic voice calling from the realm of the invisible. Cry aloud, ye that are of low aim! Wherefore have ye turned away from My holy and immortal wine unto evanescent water?"},{"id":"p63","part":"persian","n":63,"ref":"626369506","inv":"O Ye Peoples of the World!","text":"Know, verily, that an unforeseen calamity followeth you, and grievous retribution awaiteth you. Think not that which ye have committed hath been effaced in My sight. By My beauty! All your doings hath My pen graven with open characters upon tablets of chrysolite."},{"id":"p64","part":"persian","n":64,"ref":"213141042","inv":"O Oppressors on Earth!","text":"Withdraw your hands from tyranny, for I have pledged Myself not to forgive any man’s injustice. This is My covenant which I have irrevocably decreed in the preserved tablet and sealed with My seal of glory."},{"id":"p65","part":"persian","n":65,"ref":"028529394","inv":"O Rebellious Ones!","text":"My forbearance hath emboldened you and My long-suffering hath made you negligent, in such wise that ye have spurred on the fiery charger of passion into perilous ways that lead unto destruction. Have ye thought Me heedless or that I was unaware?"},{"id":"p66","part":"persian","n":66,"ref":"062883030","inv":"O Emigrants!","text":"The tongue I have designed for the mention of Me, defile it not with detraction. If the fire of self overcome you, remember your own faults and not the faults of My creatures, inasmuch as every one of you knoweth his own self better than he knoweth others."},{"id":"p67","part":"persian","n":67,"ref":"807401042","inv":"O Children of Fancy!","text":"Know, verily, that while the radiant dawn breaketh above the horizon of eternal holiness, the satanic secrets and deeds done in the gloom of night shall be laid bare and manifest before the peoples of the world."},{"id":"p68","part":"persian","n":68,"ref":"737972628","inv":"O Weed that Springeth Out of Dust!","text":"Wherefore have not these soiled hands of thine touched first thine own garment, and why with thine heart defiled with desire and passion dost thou seek to commune with Me and to enter My sacred realm? Far, far are ye from that which ye desire."},{"id":"p69","part":"persian","n":69,"ref":"810818726","inv":"O Children of Adam!","text":"Holy words and pure and goodly deeds ascend unto the heaven of celestial glory. Strive that your deeds may be cleansed from the dust of self and hypocrisy and find favor at the court of glory; for ere long the assayers of mankind shall, in the holy presence of the Adored One, accept naught but absolute virtue and deeds of stainless purity. This is the daystar of wisdom and of divine mystery that hath shone above the horizon of the divine will. Blessed are they that turn thereunto."},{"id":"p70","part":"persian","n":70,"ref":"400714616","inv":"O Son of Worldliness!","text":"Pleasant is the realm of being, wert thou to attain thereto; glorious is the domain of eternity, shouldst thou pass beyond the world of mortality; sweet is the holy ecstasy if thou drinkest of the mystic chalice from the hands of the celestial Youth. Shouldst thou attain this station, thou wouldst be freed from destruction and death, from toil and sin."},{"id":"p71","part":"persian","n":71,"ref":"750932930","inv":"O My Friends!","text":"Call ye to mind that covenant ye have entered into with Me upon Mount Párán, situate within the hallowed precincts of Zamán. I have taken to witness the concourse on high and the dwellers in the city of eternity, yet now none do I find faithful unto the covenant. Of a certainty pride and rebellion have effaced it from the hearts, in such wise that no trace thereof remaineth. Yet knowing this, I waited and disclosed it not."},{"id":"p72","part":"persian","n":72,"ref":"261142065","inv":"O My Servant!","text":"Thou art even as a finely tempered sword concealed in the darkness of its sheath and its value hidden from the artificer’s knowledge. Wherefore come forth from the sheath of self and desire that thy worth may be made resplendent and manifest unto all the world."},{"id":"p73","part":"persian","n":73,"ref":"369559272","inv":"O My Friend!","text":"Thou art the daystar of the heavens of My holiness, let not the defilement of the world eclipse thy splendor. Rend asunder the veil of heedlessness, that from behind the clouds thou mayest emerge resplendent and array all things with the apparel of life."},{"id":"p74","part":"persian","n":74,"ref":"077330259","inv":"O Children of Vainglory!","text":"For a fleeting sovereignty ye have abandoned My imperishable dominion, and have adorned yourselves with the gay livery of the world and made of it your boast. By My beauty! All will I gather beneath the one-colored covering of the dust and efface all these diverse colors save them that choose My own, and that is purging from every color."},{"id":"p75","part":"persian","n":75,"ref":"783843342","inv":"O Children of Negligence!","text":"Set not your affections on mortal sovereignty and rejoice not therein. Ye are even as the unwary bird that with full confidence warbleth upon the bough; till of a sudden the fowler Death throweth it upon the dust, and the melody, the form and the color are gone, leaving not a trace. Wherefore take heed, O bondslaves of desire!"},{"id":"p76","part":"persian","n":76,"ref":"358991785","inv":"O Son of My Handmaid!","text":"Guidance hath ever been given by words, and now it is given by deeds. Everyone must show forth deeds that are pure and holy, for words are the property of all alike, whereas such deeds as these belong only to Our loved ones. Strive then with heart and soul to distinguish yourselves by your deeds. In this wise We counsel you in this holy and resplendent tablet."},{"id":"p77","part":"persian","n":77,"ref":"815379093","inv":"O Son of Justice!","text":"In the night-season the beauty of the immortal Being hath repaired from the emerald height of fidelity unto the Sadratu’l-Muntahá, and wept with such a weeping that the concourse on high and the dwellers of the realms above wailed at His lamenting. Whereupon there was asked, Why the wailing and weeping? He made reply: As bidden I waited expectant upon the hill of faithfulness, yet inhaled not from them that dwell on earth the fragrance of fidelity. Then summoned to return I beheld, and lo! certain doves of holiness were sore tried within the claws of the dogs of earth. Thereupon the Maid of heaven hastened forth unveiled and resplendent from Her mystic mansion, and asked of their names, and all were told but one. And when urged, the first letter thereof was uttered, whereupon the dwellers of the celestial chambers rushed forth out of their habitation of glory. And whilst the second letter was pronounced they fell down, one and all, upon the dust. At that moment a voice was heard from the inmost shrine: “Thus far and no farther.” Verily We bear witness to that which they have done and now are doing."},{"id":"p78","part":"persian","n":78,"ref":"733813371","inv":"O Son of My Handmaid!","text":"Quaff from the tongue of the merciful the stream of divine mystery, and behold from the dayspring of divine utterance the unveiled splendor of the daystar of wisdom. Sow the seeds of My divine wisdom in the pure soil of the heart, and water them with the waters of certitude, that the hyacinths of knowledge and wisdom may spring up fresh and green from the holy city of the heart."},{"id":"p79","part":"persian","n":79,"ref":"492899806","inv":"O Son of Desire!","text":"How long wilt thou soar in the realms of desire? Wings have I bestowed upon thee, that thou mayest fly to the realms of mystic holiness and not the regions of satanic fancy. The comb, too, have I given thee that thou mayest dress My raven locks, and not lacerate My throat."},{"id":"p80","part":"persian","n":80,"ref":"119659976","inv":"O My Servants!","text":"Ye are the trees of My garden; ye must give forth goodly and wondrous fruits, that ye yourselves and others may profit therefrom. Thus it is incumbent on every one to engage in crafts and professions, for therein lieth the secret of wealth, O men of understanding! For results depend upon means, and the grace of God shall be all-sufficient unto you. Trees that yield no fruit have been and will ever be for the fire."},{"id":"p81","part":"persian","n":81,"ref":"468470133","inv":"O My Servant!","text":"The basest of men are they that yield no fruit on earth. Such men are verily counted as among the dead, nay better are the dead in the sight of God than those idle and worthless souls."},{"id":"p82","part":"persian","n":82,"ref":"002944255","inv":"O My Servant!","text":"The best of men are they that earn a livelihood by their calling and spend upon themselves and upon their kindred for the love of God, the Lord of all worlds."},{"id":"p83","part":"persian","n":83,"ref":"576315659","text":"The mystic and wondrous Bride, hidden ere this beneath the veiling of utterance, hath now, by the grace of God and His divine favor, been made manifest even as the resplendent light shed by the beauty of the Beloved. I bear witness, O friends! that the favor is complete, the argument fulfilled, the proof manifest and the evidence established. Let it now be seen what your endeavors in the path of detachment will reveal. In this wise hath the divine favor been fully vouchsafed unto you and unto them that are in heaven and on earth. All praise to God, the Lord of all Worlds.","title":"Closing"}];

/* phrase ordering */
function phrasesOf(p){
  const txt=fullText(p).replace(/\n/g,' ');
  let parts=txt.match(/[^,;:.!?]+[,;:.!?”’]*\s*/g)||[txt];
  parts=parts.map(s=>s).filter(s=>s.trim());
  // merge tiny fragments into neighbours so each chip carries meaning
  const out=[]; for(const s of parts){ if(out.length && (words(s).length<3 || words(out[out.length-1]).length<3)) out[out.length-1]+=s; else out.push(s); }
  return out;
}

  const o=view.order; const finished=o.done===o.ph.length;
  m.innerHTML=`<div class="controls">${invToggle()}<span class="meta">Tap the phrases in order. ${o.done} of ${o.ph.length} placed${o.slips?` · ${o.slips} slip${o.slips>1?'s':''}`:''}.</span><button class="btn" id="restart">Start over</button></div>
