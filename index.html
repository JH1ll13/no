/* written recall */
function align(target,typed){ // LCS on normalized words
  const a=target.map(norm), b=typed.map(norm), n=a.length, mm=b.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(mm+1));
  for(let i=n-1;i>=0;i--) for(let j=mm-1;j>=0;j--) dp[i][j]= a[i]===b[j]? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n&&j<mm){ if(a[i]===b[j]){ops.push(['ok',target[i]]);i++;j++} else if(dp[i+1][j]>=dp[i][j+1]){ops.push(['miss',target[i]]);i++} else {ops.push(['extra',typed[j]]);j++} }
  while(i<n) ops.push(['miss',target[i++]]); while(j<mm) ops.push(['extra',typed[j++]]);
  return {ops,score:n?Math.round(100*dp[0][0]/n - 100*Math.max(0,mm-dp[0][0])/n*0.5):0};
}
function renderRecall(p,m){
  const res=view.recall;
  if(res&&res.id===p.id&&res.done){
    const s=Math.max(0,res.score);
    m.innerHTML=`<div class="score"><b class="${s>=95?'':s>=80?'mid':'low'}">${s}%</b><span class="meta">${res.ops.filter(o=>o[0]==='ok').length} of ${res.total} words recalled in order${res.ops.some(o=>o[0]==='extra')?'; extra words are struck through':''}. Punctuation and capitals are ignored.</span></div>
      ${opening(p)}<div class="text diff" style="margin-top:10px">${res.ops.map(([k,w])=>`<span class="${k}">${esc(w)}</span>`).join(' ')}</div>
      <div class="controls" style="margin-top:14px"><button class="btn primary" id="again">Try again</button><button class="btn" id="edit">Edit my attempt</button></div>`;
    return;
  }
  m.innerHTML=`<div class="controls">${invToggle()}<span class="meta">Write the passage from memory, then check it word by word.</span></div>
    ${opening(p)}<textarea class="recall" id="recallbox" style="margin-top:10px" placeholder="Begin writing…" spellcheck="false" autocapitalize="sentences">${esc(res&&res.id===p.id?res.typed:'')}</textarea>
    <div class="controls" style="margin-top:10px"><button class="btn primary" id="check">Check</button><span class="meta">The passage has ${wordCount(p)} words.</span></div>`;
}
function checkRecall(){
  const p=BY_ID[view.id], typed=$('#recallbox').value, target=words(fullText(p));
  const {ops,score}=align(target,words(typed));
  view.recall={id:p.id,typed,done:true,ops,score,total:target.length};
  const r={...rec(p.id)}; const s=Math.max(0,score);
  r.best=Math.max(r.best??0,s); progress[p.id]=r;
  grade(p.id, s>=95?2: s>=80?1:0);
  renderMode();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-i],[data-k]'); if(!t) return;
  if(t.dataset.tab){ prefs.tab=t.dataset.tab; save(); renderList(); return; }
  if(t.classList.contains('row')||t.id==='daily'){ open(t.dataset.id); return; }
  if(t.id==='back'){ document.body.classList.remove('reading'); history.replaceState(null,'',location.pathname+location.search); window.scrollTo(0,0); return; }
  if(t.id==='prev') return neighbor(-1);
  if(t.id==='next') return neighbor(1);
  if(t.id==='star'){ const r={...rec(view.id)}; r.star=!r.star; progress[view.id]=r; save(); renderLeaf(); renderList(); return; }
  if(t.dataset.mode){ prefs.mode=t.dataset.mode; view.peek=new Set(); save(); renderLeaf(); return; }
  if(t.dataset.q){ grade(view.id,+t.dataset.q); return; }
  if(t.id==='more'){ applyLevel(Math.floor(view.level/10)*10+10); return; }
  if(t.id==='less'){ applyLevel(Math.ceil(view.level/10)*10-10); return; }
  if(t.id==='reshuffle'){ view.seeds[view.id]=(Math.random()*4e9)>>>0; view.peek=new Set(); renderMode(); return; }
  if(t.dataset.i!==undefined){ if(!t.classList.contains('hid')) return; const i=+t.dataset.i; view.peek.has(i)?view.peek.delete(i):view.peek.add(i); t.classList.toggle('peek'); return; }
  if(t.dataset.k){ const k=t.dataset.k; if(view.peek.has(k)){view.peek.delete(k);t.textContent=t.dataset.w[0]} else {view.peek.add(k);t.textContent=t.dataset.w} t.classList.toggle('peek'); return; }
  if(t.dataset.ph!==undefined){ const o=view.order, i=+t.dataset.ph; if(i===o.done){o.done++; renderMode(); if(o.done===o.ph.length&&!o.slips) shimmer();} else {o.slips++; t.classList.remove('wrong'); void t.offsetWidth; t.classList.add('wrong'); const meta=$('#mode .meta'); if(meta) meta.textContent=`Tap the phrases in order. ${o.done} of ${o.ph.length} placed · ${o.slips} slip${o.slips>1?'s':''}.`;} return; }
  if(t.id==='restart'){ view.order=null; renderMode(); return; }
  if(t.id==='check'){ checkRecall(); return; }
  if(t.id==='again'){ view.recall=null; renderMode(); $('#recallbox')?.focus(); return; }
  if(t.id==='edit'){ view.recall.done=false; renderMode(); return; }
  if(t.id==='listen-na'){ $('#na-note').hidden=false; return; }
  if(t.id==='listen'){ speech.on?stopSpeech():startSpeech(); return; }
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input[type=search],textarea')) return;
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-i],[data-k]')){ e.preventDefault(); e.target.click(); return; }
  if(!view.id||view.id==='about') return;
  if(e.key==='ArrowRight') neighbor(1); else if(e.key==='ArrowLeft') neighbor(-1);
  else if(prefs.mode==='fade'&&(e.key==='+'||e.key==='=')) applyLevel(Math.floor(view.level/10)*10+10);
  else if(prefs.mode==='fade'&&e.key==='-') applyLevel(Math.ceil(view.level/10)*10-10);
});
document.addEventListener('input',e=>{
  if(e.target.id==='search') renderList();
  if(e.target.id==='lvl') applyLevel(+e.target.value);
});
document.addEventListener('change',e=>{
  if(e.target.id==='rate'){ prefs.rate=+e.target.value; save(); }
  if(e.target.id==='echo'||e.target.id==='loop'){ prefs[e.target.id]=e.target.checked; save(); }
  if(e.target.id==='voice'){ prefs.voice=e.target.value; save(); }
  if(e.target.id==='hint'){ prefs.hint=e.target.checked; save(); const ft=$('#fadetext'); ft?ft.classList.toggle('hints',prefs.hint):renderMode(); }
  if(e.target.id==='inv'){ stopSpeech(); prefs.inv=e.target.checked; view.peek=new Set(); view.order=null; save(); renderMode(); }
});
function applyLevel(l,animate=true){
  const f=view.fade; if(!f||f.id!==view.id||prefs.mode!=='fade'||!$('#fadetext')) return;
  l=Math.max(0,Math.min(100,Math.round(l))); view.level=l;
  const k=Math.round(f.n*l/100);
  if(k!==f.k){
    document.querySelectorAll('#fadetext .w').forEach(el=>{
      const i=+el.dataset.i, hide=f.rank[i]<k, was=el.classList.contains('hid');
      if(hide===was) return;
      el.classList.remove('fresh','appear','peek'); view.peek.delete(i);
      el.classList.toggle('hid',hide);
      if(hide){ el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label','hidden word'); }
      else { el.removeAttribute('tabindex'); el.removeAttribute('role'); el.removeAttribute('aria-label'); }
      if(animate){ void el.offsetWidth; el.classList.add(hide?'fresh':'appear'); }
    });
    f.k=k;
  }
  const r=$('#lvl'); if(r&&+r.value!==l) r.value=l;
  $('#pct').textContent=l+'%';
  $('#less').disabled=l===0; $('#more').disabled=l===100;
  $('#fadecount').textContent=`${k} of ${f.n} words hidden.${k===f.n?' Every word is hidden; recite the whole passage.':''}`;
}
/* ---------- read aloud ---------- */
const TTS='speechSynthesis' in window;
const speech={on:false,i:0,timer:null,run:0};
function listenBar(){
  if(!TTS) return `<div class="listen"><button class="btn play" id="listen-na">▶ Read aloud</button><span class="meta" id="na-note" hidden>This viewer has no built-in voice. Open the page in Safari or Chrome to listen; signed in, your progress comes with you.</span></div>`;
  const rates=[[.7,'Slow'],[.85,'Gentle'],[1,'Normal'],[1.15,'Brisk']];
  return `<div class="listen">
    <button class="btn play" id="listen" aria-pressed="${speech.on}">${speech.on?'■ Stop':'▶ Read aloud'}</button>
    <label>Speed <select id="rate">${rates.map(([v,l])=>`<option value="${v}" ${+prefs.rate===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label title="Pauses after each phrase so you can say it back"><input type="checkbox" id="echo" ${prefs.echo?'checked':''}> Pause to repeat</label>
    <label><input type="checkbox" id="loop" ${prefs.loop?'checked':''}> Loop</label>
    <label id="voicewrap" hidden>Voice <select id="voice"></select></label>
  </div>`;
}
function englishVoices(){
  try{ const good=/natural|premium|enhanced|neural|google|siri/i;
    return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>good.test(b.name)-good.test(a.name)); }catch(e){ return []; }
}
function pickVoice(){ const vs=englishVoices(); return vs.find(v=>v.name===prefs.voice)||vs[0]||null; }
function fillVoices(){
  const sel=$('#voice'); if(!sel) return; const vs=englishVoices();
  $('#voicewrap').hidden=vs.length<2; const cur=pickVoice();
  sel.innerHTML=vs.map(v=>`<option ${cur&&v.name===cur.name?'selected':''}>${esc(v.name)}</option>`).join('');
}
if(TTS) try{ speechSynthesis.addEventListener('voiceschanged',fillVoices); }catch(e){}
function markRange(a,b){
  document.querySelectorAll('.w.speaking').forEach(el=>el.classList.remove('speaking'));
  for(let i=a;i<b;i++){ const el=document.querySelector(`[data-wi="${i}"]`); if(el) el.classList.add('speaking'); }
}
function updatePlay(){ const b=$('#listen'); if(b){ b.textContent=speech.on?'■ Stop':'▶ Read aloud'; b.setAttribute('aria-pressed',speech.on); } }
function stopSpeech(){ speech.run++; speech.on=false; clearTimeout(speech.timer); try{ if(TTS) speechSynthesis.cancel(); }catch(e){} markRange(0,0); updatePlay(); }
function startSpeech(){
  const p=BY_ID[view.id]; if(!p) return;
  const phr=phrasesOf(p); let c=0;
  const ranges=phr.map(s=>{ const n=words(s).length, r=[c,c+n]; c+=n; return r; });
  try{ speechSynthesis.cancel(); }catch(e){}
  speech.run++; const run=speech.run; speech.on=true; speech.i=0; updatePlay();
  const next=()=>{
    if(run!==speech.run) return;
    if(speech.i>=phr.length){ if(prefs.loop){ speech.i=0; speech.timer=setTimeout(next,1600); } else stopSpeech(); return; }
    const k=speech.i, text=phr[k], [a,b]=ranges[k], offs=[...text.matchAll(WORD)].map(m=>m.index);
    const u=new SpeechSynthesisUtterance(text.trim()); u.rate=+prefs.rate||.85;
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-US';
    const lead=text.length-text.trimStart().length;
    u.onstart=()=>{ if(run===speech.run) markRange(a,a+1); };
    u.onboundary=e=>{ if(run!==speech.run||(e.name&&e.name!=='word')) return; let j=0; while(j+1<offs.length&&offs[j+1]<=e.charIndex+lead) j++; markRange(a+j,a+j+1); };
    u.onend=()=>{ if(run!==speech.run) return; speech.i++;
      if(prefs.echo){ markRange(a,b); speech.timer=setTimeout(next,900+(b-a)*600); } else speech.timer=setTimeout(next,150); };
    u.onerror=e=>{ if(run!==speech.run||e.error==='interrupted'||e.error==='canceled') return; stopSpeech(); toast('This browser could not play the voice'); };
    try{ speechSynthesis.speak(u); }catch(e){ stopSpeech(); toast('Read-aloud is not available in this browser'); }
  };
  next();
}
function shimmer(){ const l=$('#leaf'); l.classList.remove('shimmer'); void l.offsetWidth; l.classList.add('shimmer'); }
let tt; function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }
function route(){ const id=location.hash.slice(1);
  if(id==='about'){ stopSpeech(); view.id='about'; document.body.classList.add('reading'); renderLeaf(); renderList(); window.scrollTo(0,0); return; }
  if(BY_ID[id]) show(id); else { document.body.classList.remove('reading'); if(!view.id){ view.id='a1'; renderLeaf(); renderList(); } } }
window.addEventListener('hashchange',route);

/* swipe between passages */
let swipe=null;
$('#leaf').addEventListener('touchstart',e=>{
  if(e.touches.length!==1||e.target.closest('textarea,input,select,.modes')){ swipe=null; return; }
  const t=e.touches[0]; swipe={x:t.clientX,y:t.clientY,t:Date.now()};
},{passive:true});
$('#leaf').addEventListener('touchend',e=>{
  if(!swipe||!view.id||view.id==='about'){ swipe=null; return; }
  const t=e.changedTouches[0], dx=t.clientX-swipe.x, dy=t.clientY-swipe.y, quick=Date.now()-swipe.t<700; swipe=null;
  if(!quick||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*.6) return;
  const i=PASSAGES.findIndex(p=>p.id===view.id), dir=dx<0?1:-1; if(!PASSAGES[i+dir]) return;
  const l=$('#leaf'); l.classList.remove('enter-next','enter-prev'); void l.offsetWidth; l.classList.add(dir>0?'enter-next':'enter-prev');
  neighbor(dir);
},{passive:true});

renderDaily(); renderTally(); renderList();
if(!BY_ID[location.hash.slice(1)]){ view.id='a1'; renderLeaf(); renderList(); }
route();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
